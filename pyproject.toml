[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "portfolio-deploy-agent"
version = "2.0.0"
description = "A Telegram co-pilot that turns a written investing plan into monthly buy lists, enforces guardrails, and keeps you from panic-selling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nainil" }]
dependencies = [
    "python-telegram-bot[job-queue]>=21.6,<23",
    "yfinance>=0.2.54",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pda = "pda.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
