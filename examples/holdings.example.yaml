# holdings.example.yaml: made-up starting positions for the demo and tests.
# Not a real portfolio. It is deliberately a little messy (QQQ-heavy, NVDA
# over its cap, no XLV or BRK.B yet) so the demo shows the guardrails working.
#
# For YOUR portfolio, either:
#   cp examples/holdings.example.yaml config/holdings.yaml   (gitignored), edit it, then
#   pda import config/holdings.yaml
# or export "Positions" as CSV from your broker and send it to the bot
# (or run `pda import Portfolio_Positions.csv`).
#
# avg_cost is per share. Tickers not in strategy.yaml are tracked but never bought.

holdings:
  - { ticker: VTI,  shares: 40.0, avg_cost: 300.00 }
  - { ticker: QQQ,  shares: 16.0, avg_cost: 520.00 }
  - { ticker: VXUS, shares: 60.0, avg_cost: 70.00 }
  - { ticker: BND,  shares: 40.0, avg_cost: 72.00 }
  - { ticker: GLD,  shares: 6.0,  avg_cost: 250.00 }
  - { ticker: NVDA, shares: 25.0, avg_cost: 120.00 }
  - { ticker: MSFT, shares: 5.0,  avg_cost: 410.00 }
  - { ticker: AAPL, shares: 6.0,  avg_cost: 220.00 }
  - { ticker: AMZN, shares: 4.0,  avg_cost: 190.00 }
  - { ticker: COST, shares: 1.0,  avg_cost: 900.00 }
  - { ticker: TSLA, shares: 2.0,  avg_cost: 250.00 }
